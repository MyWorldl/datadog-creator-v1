name: CI

# Roda a verificação em todo push na main e em todo Pull Request para a main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Menor privilégio: o job só precisa ler o código.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (do package-lock)
        run: npm ci

      - name: Versão do package.json bate com o histórico (Sistema -> Sobre)
        run: npm run check:version

      # Gate contra vulnerabilidade alta/crítica em dependências — o mesmo
      # tipo de CVE que exigiu o bump manual do Next.js 16.2.10 -> 16.2.11
      # teria sido pego aqui, sem depender de auditoria manual. Moderado/baixo
      # não bloqueia o PR (ver package.json -> overrides pros já tratados; a
      # moderada de exceljs/uuid é aceita de propósito — ver comentário em
      # src/components/discovery/DiscoveryCreate.tsx, o único fix disponível
      # troca essa moderada por uma cadeia com vulnerabilidade ALTA).
      - name: Auditoria de dependências (npm audit, alto/crítico)
        run: npm audit --audit-level=high

      - name: ESLint
        run: npm run lint

      # Migração incremental pra TypeScript (começou por crypto-keys.ts e
      # finops-pricing.ts) — allowJs+checkJs:false no tsconfig.json faz o
      # resto do projeto (ainda em .js) não ser type-checado, só os .ts novos.
      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Testes (node --test)
        run: npm test

      - name: Build de produção
        run: npm run build
