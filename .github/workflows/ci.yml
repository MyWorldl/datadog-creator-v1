name: CI

# Roda a verificação em todo push na main e em todo Pull Request para a main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Menor privilégio: o job só precisa ler o código.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, testes e build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (do package-lock)
        run: npm ci

      - name: Versão do package.json bate com o histórico (Sistema -> Sobre)
        run: npm run check:version

      # Gate contra vulnerabilidade alta/crítica em dependências — o mesmo
      # tipo de CVE que exigiu o bump manual do Next.js 16.2.10 -> 16.2.11
      # teria sido pego aqui, sem depender de auditoria manual. Moderado/baixo
      # não bloqueia o PR (ver package.json -> overrides pros já tratados; a
      # moderada de exceljs/uuid é aceita de propósito — ver comentário em
      # src/components/discovery/DiscoveryCreate.tsx, o único fix disponível
      # troca essa moderada por uma cadeia com vulnerabilidade ALTA).
      # --omit=dev: o gate vale pro que VAI PRA PRODUÇÃO. Ferramentas só de
      # desenvolvimento (ex.: eslint-config-next -> fast-glob -> micromatch ->
      # braces, advisory GHSA-vfj7-8cjw-p6xm sem versão corrigida publicada)
      # não rodam no servidor nem no browser — bloquear o PR por elas só gera
      # ruído, e o único "fix" sugerido pelo npm é um downgrade pro Next 14.
      - name: Auditoria de dependências de produção (npm audit, alto/crítico)
        run: npm audit --omit=dev --audit-level=high

      - name: ESLint
        run: npm run lint

      # src/ já é 100% TypeScript (strict). Os testes (tests/*.js) rodam direto
      # no Node (type stripping) e não passam pelo tsc.
      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Testes (node --test)
        run: npm test

      - name: Build de produção
        run: npm run build
