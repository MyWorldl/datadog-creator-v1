name: CI

# Roda a verificação em todo push na main e em todo Pull Request para a main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Menor privilégio: o job só precisa ler o código.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (do package-lock)
        run: npm ci

      - name: Versão do package.json bate com o histórico (Sistema -> Sobre)
        run: npm run check:version

      # Gate contra vulnerabilidade alta/crítica em dependências — o mesmo
      # tipo de CVE que exigiu o bump manual do Next.js 16.2.10 -> 16.2.11
      # teria sido pego aqui, sem depender de auditoria manual. Moderado/baixo
      # não bloqueia o PR (ver package.json -> overrides pros já tratados).
      - name: Auditoria de dependências (npm audit, alto/crítico)
        run: npm audit --audit-level=high

      - name: ESLint
        run: npm run lint

      - name: Testes (node --test)
        run: npm test

      - name: Build de produção
        run: npm run build
