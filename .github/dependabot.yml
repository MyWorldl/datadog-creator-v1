# .github/dependabot.yml
#
# Abre PR automático quando há atualização de dependência — inclusive
# patches de segurança (ex.: o Next.js 16.2.10 -> 16.2.11 de 20/07/2026,
# que corrigiu CVEs ativos e só foi pego aqui via auditoria manual).
# Dependabot sinaliza esses casos sozinho, sem esperar a próxima auditoria.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Agrupa patches/minors num PR só (reduz ruído); majors continuam
      # separados, pra revisar breaking changes com atenção individual.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Os tipos acompanham o runtime (engines: node 22.x) — @types/node 26
      # descreveria APIs que o Node 22 em produção não tem.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (compilador nativo) compila e builda o app, mas quebra o
      # ESLint: typescript-eslint ainda não suporta TS >= 7 (previsto pro 7.1).
      # Testado em out/2026 — reavaliar quando o typescript-eslint suportar.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
